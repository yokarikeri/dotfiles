# Load settings shared with the popup server (see tmux-popup.sh / tmux-popup.conf)
source-file ~/.config/tmux/tmux-shared.conf

# Open a popup window.
# run-shell is used instead of a direct display-popup binding because tmux
# expands #{...} format strings in the run-shell command string before passing
# it to the shell; display-popup arguments and -e options do not expand them.
# #{session_name} is forwarded as $1 to tmux-popup.sh so each tmux session
# gets its own popup namespace (see tmux-popup.sh for details).
bind P run-shell "tmux display-popup -E -d '#{pane_current_path}' -w 100% -h 100% '$HOME/.local/bin/tmux-popup.sh' '#{session_name}'"
