[fill]
symbol = ' '
style = 'none'
disabled = false

[line_break]
disabled = false

[character]
success_symbol = '❯'
error_symbol = '❯'
vimcmd_symbol = '❮'
vimcmd_replace_one_symbol = '[❮](bold fg:p10k_vivid_blue)'
vimcmd_replace_symbol = '[❮](bold fg:p10k_vivid_blue)'
vimcmd_visual_symbol = '[❮](bold fg:p10k_yellow)'
# format = "$symbol "
