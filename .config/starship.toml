# ~/.config/starship.toml

# Tip: To check the default value, run the following command:
# curl -s https://starship.rs/config-schema.json | jq -r '"property_name \t| default_key \t| default_value", (.properties | to_entries[] | select(.value.default | type == "object") | .key as $pname | .value.default | to_entries[] | "\($pname) \t| \(.key) \t| \(.value | tojson)")' | column -t -s $'\t'
"$schema" = 'https://starship.rs/config-schema.json'

# ================================
#  p10k_classic_like
# ================================

format = """
[](fg:p10k_bg)[$os ](bold bg:p10k_bg fg:white)\
([](bg:p10k_bg fg:p10k_grey_dark)[ $directory ](bg:p10k_bg fg:p10k_vivid_blue))\
([](bg:p10k_bg fg:p10k_grey_dark)[  ${env_var.AWS_PROFILE} ](bg:p10k_bg fg:p10k_grey_light))\
([](bg:p10k_bg fg:p10k_grey_dark)[ $time ](bg:p10k_bg fg:p10k_grey_mid))\
[](fg:p10k_bg)\
([ $status](fg:p10k_red))\
([ $cmd_duration](fg:p10k_grey_dark))\
$fill\
([ $username ](fg:p10k_grey_dark))\
([$hostname ](fg:p10k_grey_dark))\
([](fg:p10k_bg)[ $git_branch( $git_state )$git_status ](bg:p10k_bg fg:p10k_grey_light)[](fg:p10k_bg))\
$line_break\
[$character](fg:p10k_vivid_green)"""

palette = 'p10k_classic_like'

# ================================
#  Color Palettes
# ================================

[palettes.p10k_classic_like]
p10k_bg = '238' # #444444
p10k_vivid_blue = '39' # #00afff
p10k_vivid_green = '76' # #5fd700
p10k_vivid_red = '196' # #ff0000
p10k_red = '203' # #ff5f5f # '160' # #d70000
p10k_orange = '208' # #ff8700
p10k_yellow = '178' # #dfaf00
p10k_green = '70' # #5faf00
p10k_dark_green = '28' # #008700
p10k_cyan = '37' # #00afaf
p10k_blue = '32' # #0087d7
p10k_purple = '99' # #875fff
p10k_pink = '168' # #d75f87
p10k_turquoise = '66' # #5f8787
p10k_grey_dark = '243' # #767676
p10k_grey_mid = '248' # #a8a8a8
p10k_grey_light = '253' # #dadada

# ================================
#  env_var Module
# ================================

[env_var.AWS_PROFILE]
format = '$env_value'

# ================================
#  Basic Modules
# ================================

# $os
# $hostname
# $username
# $directory
# $time
# $status
# $cmd_duration
# $shell
# $shlvl
# $sudo
# $jobs
# $netns
# $localip
# $memory_usage
# $battery
# $fill
# $line_break
# $character

[os]
format = '$symbol' # symbols are described below
disabled = false

[hostname]
ssh_only = true
format = '$hostname' # '($ssh_symbol )$hostname'
trim_at = '.'
# ssh_symbol = '' # "🌐 "
# style = "bold white"
# detect_env_vars = []
# aliases = {}
disabled = false

[username]
format = '$user'
show_always = true
# style = "green dimmed bold"
# style_root = "red bold"
# style_user = "yellow bold"
# detect_env_vars = []
# aliases = {}
disabled = false

[directory]
format = '($read_only )$path'
read_only = ''
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = true # truncate to the root of the git repo
# style = "cyan bold"
# fish_style_pwd_dir_length = 0
# use_logical_path = true
# repo_root_format = "[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "
# style = "cyan bold"
# repo_root_style = null
# before_repo_root_style = null
# read_only_style = "red"
# home_symbol = "~"
# use_os_path_sep = true
disabled = false

[directory.substitutions]
'/mnt/c/Users/username' = ' ' # Change as you like
'Documents' = '󰈙 '
'Downloads' = ' '
'Music' = '󰝚 '
'Pictures' = ' '
'Developer' = '󰲋 '

[time]
time_format = '%R' # %R = %H:%M / %T = %H:%M:%S
format = ' $time'
# style = "bold yellow"
# use_12hr = false
# utc_time_offset = "local"
# time_range = "-"
disabled = false

[status]
format = '$symbol $common_meaning$signal_name$maybe_int'
symbol = ''
not_executable_symbol = ''
not_found_symbol = ''
sigint_symbol = '󰟾'
signal_symbol = ''
map_symbol = true
# style = "bold red"
# success_symbol = ""
# recognize_signal_code = true
# pipestatus = false
# pipestatus_separator = "|"
# pipestatus_format = "\\[$pipestatus\\] => [$symbol$common_meaning$signal_name$maybe_int]($style) "
disabled = false

[cmd_duration]
format = ' $duration'
show_milliseconds = false
show_notifications = true
min_time = 4_500 # 4.5s
min_time_to_notify = 45_000 # 45s
# style = "yellow bold"
disabled = false

[shell]
# format = "[$indicator]($style) "
# bash_indicator = "bsh"
# fish_indicator = "fsh"
# zsh_indicator = "zsh"
# powershell_indicator = "psh"
# ion_indicator = "ion"
# elvish_indicator = "esh"
# tcsh_indicator = "tsh"
# nu_indicator = "nu"
# xonsh_indicator = "xsh"
# cmd_indicator = "cmd"
# unknown_indicator = ""
# style = "white bold"
disabled = true

[shlvl]
# threshold = 2
# format = "[$symbol$shlvl]($style) "
# symbol = "↕️   "
# repeat = false
# repeat_offset = 0
# style = "bold yellow"
disabled = true

[sudo]
# format = "[as $symbol]($style)"
# symbol = "🧙 "
# style = "bold blue"
# allow_windows = false
disabled = true

[jobs]
# threshold = 1
# symbol_threshold = 1
