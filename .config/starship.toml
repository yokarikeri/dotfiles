# ================================
#  Environmental Information Display Modules:
# ================================

# $git_branch$git_state$git_status$git_commit$git_metrics
# $aws$azure$gcloud$openstack
# $container$docker_context$kubernetes$helm$singularity$vagrant
# $terraform$pulumi
# $conda$pixi$spack
# $hg_branch$hg_state$fossil_branch$fossil_metrics$pijul_channel
# $vcsh$mise$direnv$nix_shell
# $nats

[git_branch]
format = '$symbol $branch(:$remote_branch)'
symbol = ''
always_show_remote = false
only_attached = false
# style = "bold purple"
# truncation_length = 9223372036854775807
# truncation_symbol = "…"
# ignore_branches = []
disabled = false

[git_state]
format = '\($state( $progress_current/$progress_total)\)'
# rebase = "REBASING"
# merge = "MERGING"
# revert = "REVERTING"
# cherry_pick = "CHERRY-PICKING"
# bisect = "BISECTING"
# am = "AM"
# am_or_rebase = "AM/REBASE"
# style = "bold yellow"
disabled = false

[git_status]
format = '($all_status$ahead_behind)'
# all_status = $conflicted$stashed$deleted$renamed$modified$typechanged$staged$untracked
conflicted = ' [󰀦 Conflict](bg:p10k_bg fg:p10k_vivid_red)'
staged = ' 󰐕'
untracked = ' 󰇘'
deleted = ' 󰅖'
renamed = ' 󰑕'
modified = ' 󰏫'
typechanged = ' 󰬳'
stashed = ' 󰀼'
# ahead_behind = diverged or ahead or behind or up_to_date
ahead = ' ⇡${count}'
behind = ' [⇣${count}](bg:p10k_bg fg:p10k_yellow)'
diverged = ' [⇕⇡${ahead_count}⇣${behind_count}](bg:p10k_bg fg:p10k_vivid_red)'
up_to_date = ' [](bg:p10k_bg fg:p10k_vivid_green)'
ignore_submodules = false
# style = "red bold"
disabled = false

[git_commit]
format = '\($hash$tag\)'
# commit_hash_length = 7
# style = "green bold"
# only_detached = true
# tag_symbol = " 🏷  "
# tag_disabled = true
# tag_max_candidates = 0
disabled = true

[git_metrics]
format = '([+$added]($added_style) )([-$deleted]($deleted_style))'
# added_style = "bold green"
# deleted_style = "bold red"
# only_nonzero_diffs = true
# ignore_submodules = false
disabled = true

